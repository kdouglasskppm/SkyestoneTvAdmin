<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyestone TV Admin</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1f2937;
        color: white;
        padding: 22px 30px;
    }

    header h1 {
        margin: 0 0 5px;
        font-size: 28px;
    }

    header p {
        margin: 0;
        color: #d1d5db;
    }

    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .notice {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 10px;
        padding: 15px 18px;
        margin-bottom: 25px;
        color: #9a3412;
    }

    .card {
        background: white;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 21px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    .full {
        grid-column: 1 / -1;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 15px;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    button {
        border: none;
        border-radius: 7px;
        padding: 11px 18px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .primary {
        background: #2563eb;
        color: white;
    }

    .secondary {
        background: #e5e7eb;
        color: #111827;
    }

    .danger {
        background: #dc2626;
        color: white;
    }

    button:hover {
        opacity: 0.9;
    }

    .button-row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .filters {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 15px;
        margin-bottom: 20px;
    }

    .calendar-item {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 12px;
        background: #fafafa;
    }

    .calendar-item.past {
        opacity: 0.65;
    }

    .item-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
    }

    .item-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .item-meta {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .item-details {
        margin-top: 8px;
        line-height: 1.5;
    }

    .badge {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        background: #e5e7eb;
        font-size: 12px;
        font-weight: bold;
        margin-right: 5px;
    }

    .status {
        white-space: nowrap;
    }

    .item-actions {
        display: flex;
        gap: 8px;
        margin-top: 15px;
    }

    .item-actions button {
        padding: 8px 13px;
        font-size: 13px;
    }

    .empty {
        text-align: center;
        color: #6b7280;
        padding: 30px;
    }

    @media (max-width: 700px) {
        .form-grid,
        .filters {
            grid-template-columns: 1fr;
        }

        .item-header {
            flex-direction: column;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Skyestone TV Admin</h1>
    <p>Manage the information displayed on the Skyestone television screens.</p>
</header>

<div class="container">
