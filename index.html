<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyestone TV Admin</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>Skyestone TV Admin</h1><p>Create, edit and remove information shown on Skyestone TVs.</p></div><div id="status">Demo mode</div></header>
<main>
<section class="panel"><h2>Add / Edit Information</h2><form id="itemForm"><input type="hidden" id="id"><label>Display<select id="display"><option value="hoa">HOA Business</option><option value="social">Social</option><option value="fitness">Fitness</option><option value="fitness-reservations">Fitness Room Reservations</option><option value="conference">Conference Room Reservations</option></select></label><div class="grid"><label>Date<input id="date" type="date" required></label><label>Start Time<input id="start" type="time" required></label><label>End Time<input id="end" type="time" required></label></div><label>Title<input id="title" required maxlength="100"></label><label>Details<textarea id="details" rows="3" maxlength="300"></textarea></label><label>Reserved By <input id="reservedBy" maxlength="80" placeholder="Optional"></label><div class="buttons"><button type="submit">Save Information</button><button type="button" id="cancel" class="secondary">Cancel</button></div></form></section>
<section class="panel"><div class="toolbar"><h2>Current & Upcoming</h2><select id="filter"><option value="all">All Displays</option><option value="hoa">HOA Business</option><option value="social">Social</option><option value="fitness">Fitness</option><option value="fitness-reservations">Fitness Room Reservations</option><option value="conference">Conference Room Reservations</option></select></div><div id="list"></div></section>
</main><script src="admin.js"></script></body></html>
