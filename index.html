<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyestone TV Admin</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1f2937;
        color: white;
        padding: 22px 30px;
    }

    header h1 {
        margin: 0 0 5px;
        font-size: 28px;
    }

    header p {
        margin: 0;
        color: #d1d5db;
    }

    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .notice {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 10px;
        padding: 15px 18px;
        margin-bottom: 25px;
        color: #9a3412;
    }

    .card {
        background: white;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 21px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    .full {
        grid-column: 1 / -1;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 15px;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    button {
        border: none;
        border-radius: 7px;
        padding: 11px 18px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .primary {
        background: #2563eb;
        color: white;
    }

    .secondary {
        background: #e5e7eb;
        color: #111827;
    }

    .danger {
        background: #dc2626;
        color: white;
    }

    button:hover {
        opacity: 0.9;
    }

    .button-row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .filters {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 15px;
        margin-bottom: 20px;
    }

    .calendar-item {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 12px;
        background: #fafafa;
    }

    .calendar-item.past {
        opacity: 0.65;
    }

    .item-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
    }

    .item-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .item-meta {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .item-details {
        margin-top: 8px;
        line-height: 1.5;
    }

    .badge {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        background: #e5e7eb;
        font-size: 12px;
        font-weight: bold;
        margin-right: 5px;
    }

    .status {
        white-space: nowrap;
    }

    .item-actions {
        display: flex;
        gap: 8px;
        margin-top: 15px;
    }

    .item-actions button {
        padding: 8px 13px;
        font-size: 13px;
    }

    .empty {
        text-align: center;
        color: #6b7280;
        padding: 30px;
    }

    @media (max-width: 700px) {
        .form-grid,
        .filters {
            grid-template-columns: 1fr;
        }

        .item-header {
            flex-direction: column;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Skyestone TV Admin</h1>
    <p>Manage the information displayed on the Skyestone television screens.</p>
</header>

<div class="container">

    <div class="notice">
        <strong>Current Mode:</strong>
        This version saves calendar information in this browser for testing.
        The GitHub connection will be added after the Admin system is confirmed to be working.
    </div>

    <!-- ADD / EDIT FORM -->
    <div class="card">
        <h2 id="formHeading">Add Calendar Item</h2>

        <form id="calendarForm">

            <input type="hidden" id="editId">

            <div class="form-grid">

                <div>
                    <label for="display">Display</label>
                    <select id="display" required>
                        <option value="hoa">HOA Business</option>
                        <option value="social">Social</option>
                        <option value="fitness">Fitness</option>
                        <option value="fitness-reservations">Fitness Room Reservations</option>
                        <option value="conference">Conference Room Reservations</option>
                    </select>
                </div>

                <div>
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div>
                    <label for="start">Start Time</label>
                    <input type="time" id="start" required>
                </div>

                <div>
                    <label for="end">End Time</label>
                    <input type="time" id="end" required>
                </div>

                <div class="full">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Community Happy Hour"
                        required
                    >
                </div>

                <div class="full">
                    <label for="details">Details</label>
                    <textarea
                        id="details"
                        placeholder="Enter information residents should see on the TV."
                    ></textarea>
                </div>

                <div>
                    <label for="reservedBy">Reserved By</label>
                    <input
                        type="text"
                        id="reservedBy"
                        placeholder="Optional"
                    >
                </div>

            </div>

            <div class="button-row">
                <button type="submit" class="primary" id="saveButton">
                    Add Calendar Item
                </button>

                <button
                    type="button"
                    class="secondary"
                    id="cancelButton"
                    style="display:none;"
                >
                    Cancel Edit
                </button>
            </div>

        </form>
    </div>

    <!-- CALENDAR ITEMS -->
    <div class="card">
        <h2>Calendar Items</h2>

        <div class="filters">

            <input
                type="text"
                id="search"
                placeholder="Search calendar items..."
            >

            <select id="filterDisplay">
                <option value="all">All Displays</option>
                <option value="hoa">HOA Business</option>
                <option value="social">Social</option>
                <option value="fitness">Fitness</option>
                <option value="fitness-reservations">Fitness Room Reservations</option>
                <option value="conference">Conference Room Reservations</option>
            </select>

        </div>

        <div id="calendarItems"></div>

    </div>

</div>

<script>

const STORAGE_KEY = "skyestoneTvAdminCalendarV2";

const displayNames = {
    hoa: "HOA BUSINESS",
    social: "SOCIAL",
    fitness: "FITNESS",
    "fitness-reservations": "FITNESS ROOM RESERVATIONS",
    conference: "CONFERENCE ROOM RESERVATIONS"
};


/* ----------------------------------------------------
   LOAD DATA
---------------------------------------------------- */

function loadItems() {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {
            const parsed = JSON.parse(saved);

            if (Array.isArray(parsed)) {
                return parsed;
            }

        } catch (error) {
            console.error("Unable to read saved calendar data:", error);
        }
    }

    /*
       First-time default test item.
       This guarantees the Calendar Items section
       has something to display.
    */

    const defaultItems = [
        {
            id: generateId(),
            display: "social",
            date: "2026-09-15",
            start: "12:00",
            end: "13:00",
            title: "Test Social Activity",
            details: "Testing the new Admin system.",
            reservedBy: "Kenny"
        }
    ];

    saveItems(defaultItems);

    return defaultItems;
}


/* ----------------------------------------------------
   SAVE DATA
---------------------------------------------------- */

function saveItems(items) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(items)
    );
}


/* ----------------------------------------------------
   ID GENERATOR
---------------------------------------------------- */

function generateId() {

    return Date.now().toString() +
           Math.random().toString(36).substring(2, 8);
}


/* ----------------------------------------------------
   GET ITEMS
---------------------------------------------------- */

let calendarItems = loadItems();


/* ----------------------------------------------------
   FORM ELEMENTS
---------------------------------------------------- */

const form = document.getElementById("calendarForm");
const editId = document.getElementById("editId");

const display = document.getElementById("display");
const date = document.getElementById("date");
const start = document.getElementById("start");
const end = document.getElementById("end");
const title = document.getElementById("title");
const details = document.getElementById("details");
const reservedBy = document.getElementById("reservedBy");

const formHeading = document.getElementById("formHeading");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelButton");

const search = document.getElementById("search");
const filterDisplay = document.getElementById("filterDisplay");

const calendarItemsContainer =
    document.getElementById("calendarItems");


/* ----------------------------------------------------
   DATE / TIME
---------------------------------------------------- */

function itemDateTime(item) {

    return new Date(
        item.date + "T" + item.end
    );

}


/* ----------------------------------------------------
   FORMAT DATE
---------------------------------------------------- */

function formatDate(dateString) {

    const d = new Date(dateString + "T00:00:00");

    return d.toLocaleDateString(
        undefined,
        {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );
}


/* ----------------------------------------------------
   FORMAT TIME
---------------------------------------------------- */

function formatTime(timeString) {

    const parts = timeString.split(":");

    let hour = parseInt(parts[0], 10);
    const minute = parts[1];

    const suffix = hour >= 12 ? "PM" : "AM";

    hour = hour % 12;

    if (hour === 0) {
        hour = 12;
    }

    return hour + ":" + minute + " " + suffix;
}


/* ----------------------------------------------------
   ESCAPE HTML
---------------------------------------------------- */

function escapeHtml(value) {

    if (!value) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ----------------------------------------------------
   RENDER
---------------------------------------------------- */

function renderItems() {

    const searchText =
        search.value.trim().toLowerCase();

    const selectedDisplay =
        filterDisplay.value;

    const now = new Date();

    let filtered = calendarItems.filter(item => {

        const matchesSearch =
            !searchText ||
            item.title.toLowerCase().includes(searchText) ||
            (item.details || "").toLowerCase().includes(searchText) ||
            (item.reservedBy || "").toLowerCase().includes(searchText);

        const matchesDisplay =
            selectedDisplay === "all" ||
            item.display === selectedDisplay;

        return matchesSearch && matchesDisplay;

    });

    filtered.sort((a, b) => {

        const dateA =
            new Date(a.date + "T" + a.start);

        const dateB =
            new Date(b.date + "T" + b.start);

        return dateA - dateB;

    });


    if (filtered.length === 0) {

        calendarItemsContainer.innerHTML =
            '<div class="empty">No calendar items found.</div>';

        return;
    }


    calendarItemsContainer.innerHTML =
        filtered.map(item => {

            const endDate =
                itemDateTime(item);

            const isPast =
                endDate < now;

            const status =
                isPast
                    ? '<span class="badge">PAST</span>'
                    : '<span class="badge">ACTIVE / UPCOMING</span>';

            return `
                <div class="calendar-item ${isPast ? "past" : ""}">

                    <div class="item-header">

                        <div>

                            <div class="item-title">
                                ${escapeHtml(item.title)}
                            </div>

                            <div class="item-meta">

                                <span class="badge">
                                    ${escapeHtml(displayNames[item.display] || item.display)}
                                </span>

                                ${escapeHtml(formatDate(item.date))}
                                &nbsp; • &nbsp;
                                ${escapeHtml(formatTime(item.start))}
                                -
                                ${escapeHtml(formatTime(item.end))}

                            </div>

                        </div>

                        <div class="status">
                            ${status}
                        </div>

                    </div>

                    ${
                        item.details
                        ? `
                            <div class="item-details">
                                ${escapeHtml(item.details)}
                            </div>
                          `
                        : ""
                    }

                    ${
                        item.reservedBy
                        ? `
                            <div class="item-details">
                                <strong>Reserved By:</strong>
                                ${escapeHtml(item.reservedBy)}
                            </div>
                          `
                        : ""
                    }

                    <div class="item-actions">

                        <button
                            class="secondary"
                            onclick="editItem('${item.id}')"
                        >
                            Edit
                        </button>

                        <button
                            class="danger"
                            onclick="deleteItem('${item.id}')"
                        >
                            Delete
                        </button>

                    </div>

                </div>
            `;

        }).join("");

}


/* ----------------------------------------------------
   ADD / UPDATE
---------------------------------------------------- */

form.addEventListener("submit", function(event) {

    event.preventDefault();


    if (end.value <= start.value) {

        alert("The end time must be later than the start time.");

        return;
    }


    const existingId =
        editId.value;


    if (existingId) {

        const index =
            calendarItems.findIndex(
                item => item.id === existingId
            );


        if (index !== -1) {

            calendarItems[index] = {

                id: existingId,

                display: display.value,

                date: date.value,

                start: start.value,

                end: end.value,

                title: title.value.trim(),

                details: details.value.trim(),

                reservedBy: reservedBy.value.trim()

            };

        }

    } else {

        calendarItems.push({

            id: generateId(),

            display: display.value,

            date: date.value,

            start: start.value,

            end: end.value,

            title: title.value.trim(),

            details: details.value.trim(),

            reservedBy: reservedBy.value.trim()

        });

    }


    saveItems(calendarItems);

    resetForm();

    renderItems();

});


/* ----------------------------------------------------
   EDIT
---------------------------------------------------- */

function editItem(id) {

    const item =
        calendarItems.find(
            entry => entry.id === id
        );


    if (!item) {
        return;
    }


    editId.value = item.id;

    display.value = item.display;

    date.value = item.date;

    start.value = item.start;

    end.value = item.end;

    title.value = item.title;

    details.value = item.details || "";

    reservedBy.value = item.reservedBy || "";


    formHeading.textContent =
        "Edit Calendar Item";

    saveButton.textContent =
        "Save Changes";

    cancelButton.style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ----------------------------------------------------
   DELETE
---------------------------------------------------- */

function deleteItem(id) {

    const item =
        calendarItems.find(
            entry => entry.id === id
        );


    if (!item) {
        return;
    }


    const confirmed =
        confirm(
            'Delete "' +
            item.title +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    calendarItems =
        calendarItems.filter(
            entry => entry.id !== id
        );


    saveItems(calendarItems);

    renderItems();

}


/* ----------------------------------------------------
   RESET FORM
---------------------------------------------------- */

function resetForm() {

    form.reset();

    editId.value = "";

    formHeading.textContent =
        "Add Calendar Item";

    saveButton.textContent =
        "Add Calendar Item";

    cancelButton.style.display =
        "none";

}


/* ----------------------------------------------------
   CANCEL EDIT
---------------------------------------------------- */

cancelButton.addEventListener(
    "click",
    resetForm
);


/* ----------------------------------------------------
   SEARCH / FILTER
---------------------------------------------------- */

search.addEventListener(
    "input",
    renderItems
);

filterDisplay.addEventListener(
    "change",
    renderItems
);


/* ----------------------------------------------------
   INITIAL RENDER
---------------------------------------------------- */

renderItems();

</script>

</body>
</html>
